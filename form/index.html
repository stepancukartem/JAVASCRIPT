<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colors Collection</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    text-align:center;
}

.container{
    width:500px;
    margin:30px auto;
    background:#f5efe6;
    padding:20px;
}

input,select{
    width:220px;
    margin:5px;
}

button{
    width:230px;
    margin-top:10px;
}

#error{
    color:red;
    font-weight:bold;
    margin:10px;
}

.colors{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

.color-card{
    width:130px;
    height:70px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:12px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h3>Create new color</h3>

<div>
    <input type="text" id="name" placeholder="Color">
</div>

<div>
    <select id="type">
        <option>RGB</option>
        <option>RGBA</option>
        <option>HEX</option>
    </select>
</div>

<div>
    <input type="text" id="code" placeholder="Code">
</div>

<button onclick="addColor()">Save</button>

<div id="error"></div>

<h4>All colors</h4>

<div id="colors" class="colors"></div>

</div>

<script src="script.js"></script>

</body>
</html>
