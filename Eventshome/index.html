<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Практична робота</title>
</head>
<body>

<h2>Завдання 1</h2>

<button onclick="openModal()">Open modal</button>

<div id="modal" style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">

    <div style="background:white; width:300px; margin:150px auto; padding:20px; text-align:center;">

        <h2>Hello from Modal Window!</h2>

        <button onclick="closeModal()">Close</button>

    </div>

</div>

<hr>

<h2>Завдання 2</h2>

<div style="display:flex; align-items:center; gap:20px;">

    <div style="display:flex; gap:20px; border:1px solid black; padding:20px;">

        <div id="red" style="width:60px;height:60px;border-radius:50%;background:gray;"></div>

        <div id="yellow" style="width:60px;height:60px;border-radius:50%;background:orange;"></div>

        <div id="green" style="width:60px;height:60px;border-radius:50%;background:gray;"></div>

    </div>

    <button onclick="nextLight()">NEXT</button>

</div>

<hr>

<h2>Завдання 3</h2>

<progress id="progress" value="0" max="100"></progress>

<br><br>

<button onclick="addProgress()">Add 5 percent</button>

<script src="script.js"></script>

</body>
</html>
