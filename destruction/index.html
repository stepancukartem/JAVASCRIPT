<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секундомір</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            font-family:Arial, Helvetica, sans-serif;
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 0 25px rgba(0,0,0,0.3);
        }

        h1{
            font-size:60px;
            margin-bottom:30px;
            color:#1e3c72;
        }

        button{
            border:none;
            padding:12px 25px;
            margin:5px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
            transition:0.3s;
        }

        .start{
            background:#28a745;
            color:white;
        }

        .pause{
            background:#ffc107;
        }

        .reset{
            background:#dc3545;
            color:white;
        }

        button:hover{
            transform:scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="timer">00:00:00</h1>

    <button class="start" onclick="startTimer()">Старт</button>
    <button class="pause" onclick="pauseTimer()">Пауза</button>
    <button class="reset" onclick="resetTimer()">Скинути</button>
</div>

<script src="script.js"></script>

</body>
</html>
